# يزور قاعدة البيانات كل 3 أيام حتى لا يوقف Supabase المشروع المجاني بسبب قلة النشاط.
# المفتاح هنا هو نفس المفتاح العام الموجود في config.js (آمن للنشر).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query site content
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://nfqomzorgdepqoaubtdk.supabase.co/rest/v1/site_content?select=id&limit=1" \
            -H "apikey: sb_publishable_7JB6Y1uSJDEsVG0zMRdxUA_o-Ni5z4X")
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
